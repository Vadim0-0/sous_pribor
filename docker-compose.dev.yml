services:

  api:
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  
  web:
    build:
      context: ./web
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_nuxt:/app/.nuxt
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - api

volumes:
  web_node_modules:
  web_nuxt: